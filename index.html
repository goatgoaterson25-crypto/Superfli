  const title = randomItem(LEAK_TITLES);

function loadMore(n=3){

    lastSrc=src;
    const card=createCard(src, totalLoaded+1);
    feed.appendChild(card);
    totalLoaded++;
  }
}

function playCurrent(){
  const vids=document.querySelectorAll('video');
  vids.forEach((v,i)=>{
    if(i===currentIndex){v.muted=false; v.play().catch(()=>{v.muted=true; v.play().catch(()=>{})})}

  });

}

});
